<style>
body{margin:10px 12px;font:14px system-ui;color:var(--tg-theme-text-color)}header{display:flex;justify-content:space-between;align-items:center}small,#status{color:var(--tg-theme-hint-color);font-size:11px}h3{font-size:15px;margin:0}#price{font-weight:700;font-size:20px}nav{display:flex;gap:6px;margin:8px 0}button{font-size:12px;padding:5px 12px;border:0;border-radius:6px}button[data-active="1"]{background:var(--tg-theme-button-color);color:var(--tg-theme-button-text-color)}canvas{display:block;width:100%;height:215px;touch-action:pan-y}#detail{height:16px;font-size:10px;color:var(--tg-theme-hint-color)}#status{margin-top:4px}
</style>
<header><div><h3>Rapira · USDT/RUB</h3><small>Свечи и объём торгов</small></div><span id="price">—</span></header>
<nav><button data-frame="5">5м</button><button data-frame="15">15м</button><button data-frame="60">1ч</button><button id="refresh">↻</button></nav>
<canvas id="chart" width="560" height="215"></canvas><div id="detail"></div><div id="status">Загрузка данных…</div>
<script>
(()=>{const W=TelegramWidget,C=document.querySelector('#chart'),X=C.getContext('2d'),S=document.querySelector('#status'),D=document.querySelector('#detail');let state=null,rows=[],rev=0,busy=false;
const css=k=>getComputedStyle(document.documentElement).getPropertyValue('--tg-theme-'+k).trim(),fmt=x=>x.toFixed(2),clock=t=>new Date(t*1000).toLocaleTimeString('ru-RU',{timeZone:'Europe/Moscow',hour:'2-digit',minute:'2-digit'});
function draw(){const width=Math.max(200,Math.round(C.getBoundingClientRect().width));C.width=width;X.clearRect(0,0,width,215);if(!rows.length){S.textContent='Свечи пока недоступны';return}const lo=Math.min(...rows.map(r=>r[3])),hi=Math.max(...rows.map(r=>r[2])),pad=Math.max((hi-lo)*.06,.005),low=lo-pad,high=hi+pad,span=high-low,bottom=156,left=4,right=width-48,step=(right-left)/rows.length,y=p=>12+(high-p)/span*130,maxV=Math.max(1,...rows.map(r=>r[5]));X.font='10px system-ui';X.fillStyle=css('hint-color');X.strokeStyle=css('section-separator-color')||css('hint-color');X.lineWidth=.4;
for(let i=0;i<4;i++){let p=low+span*i/3,z=y(p);X.beginPath();X.moveTo(0,z);X.lineTo(right,z);X.stroke();X.fillText(fmt(p),width-44,z+3)}
rows.forEach((r,i)=>{let x=left+step*(i+.5),up=r[4]>=r[1],color=up?'#29b883':'#ed6474',w=Math.max(2,step*.62);X.strokeStyle=color;X.fillStyle=color;X.lineWidth=1;X.beginPath();X.moveTo(x,y(r[2]));X.lineTo(x,y(r[3]));X.stroke();X.fillRect(x-w/2,Math.min(y(r[1]),y(r[4])),w,Math.max(1,Math.abs(y(r[1])-y(r[4]))));X.globalAlpha=.5;X.fillRect(x-w/2,bottom+36-r[5]/maxV*30,w,r[5]/maxV*30);X.globalAlpha=1});
X.fillStyle=css('hint-color');[0,Math.floor(rows.length/2),rows.length-1].forEach(i=>X.fillText(clock(rows[i][0]),Math.min(right-38,left+i*step),211));document.querySelector('#price').textContent=fmt(rows[rows.length-1][4]);document.querySelectorAll('[data-frame]').forEach(b=>b.dataset.active=Number(b.dataset.frame)===state.f?'1':'0');fresh()}
function fresh(){if(!state||!rows.length)return;let now=Date.now()/1000,old=now-state.h>90||now-(state.c+state.f*60)>90,book=state.u&&now-state.u<45;S.textContent=(old?'⚠ История устарела · ':'')+'Свечи '+clock(state.h)+' МСК · стакан '+(book?clock(state.u):'нет свежих данных')}
function render(){try{let v=JSON.parse(W.chatData||'null');if(!v||v.v!==1||v.r<rev)return;state=v;rev=v.r;let raw=atob(v.d),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0)),view=new DataView(bytes.buffer);rows=[];for(let i=0;i+16<=view.byteLength;i+=16)rows.push([view.getUint32(i,true),...Array.from({length:4},(_,j)=>(view.getUint16(i+4+j*2,true)+v.p)/100),view.getFloat32(i+12,true)]);draw()}catch(e){S.textContent='Ошибка данных графика'}}
function ask(data){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);W.request(data).then(a=>{if(a.result){let result=JSON.parse(a.result);if(result.error)S.textContent=result.error}},e=>{S.textContent='Ошибка запроса: '+e.code}).finally(()=>{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)})}
document.querySelectorAll('[data-frame]').forEach(b=>b.onclick=()=>ask('tf:'+b.dataset.frame));document.querySelector('#refresh').onclick=()=>ask('refresh');C.onpointermove=e=>{if(!rows.length)return;let rect=C.getBoundingClientRect(),i=Math.max(0,Math.min(rows.length-1,Math.floor((e.clientX-rect.left)/Math.max(1,rect.width-48)*rows.length))),r=rows[i];D.textContent=clock(r[0])+' · О '+fmt(r[1])+'  В '+fmt(r[2])+'  Н '+fmt(r[3])+'  З '+fmt(r[4])};C.onpointerleave=C.onpointercancel=()=>{D.textContent=''};W.onEvent('chatDataChanged',render);W.onEvent('themeChanged',draw);new ResizeObserver(draw).observe(C);render();W.ready();setInterval(()=>{if(!document.hidden)fresh()},10000)
})();
</script>
