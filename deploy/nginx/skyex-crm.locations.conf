# Production config for /etc/nginx/conf.d/skyex-crm.conf.
# The rate/connection zones below must remain in the http context.
limit_req_zone $binary_remote_addr zone=crm_api_per_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=crm_auth_per_ip:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=crm_ws_per_ip:10m;

map $http_upgrade $crm_connection_upgrade {
    default upgrade;
    "" close;
}

map $request_uri $crm_cache_control {
    default "";
    ~^/api/ "no-store";
    ~^/_next/static/ "public, max-age=31536000, immutable";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/skyex.work.gd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skyex.work.gd/privkey.pem;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name skyex.work.gd;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name skyex.work.gd;

    ssl_certificate /etc/letsencrypt/live/skyex.work.gd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skyex.work.gd/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:CRM_SSL:10m;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 2m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss://skyex.work.gd" always;
    add_header Cache-Control $crm_cache_control always;
    proxy_hide_header X-Powered-By;

    # Browser-facing OIDC state/callback handlers live in Next.js. Keep this
    # longer prefix above the generic /api/ FastAPI proxy.
    location ^~ /api/auth/telegram/oidc/ {
        limit_req zone=crm_auth_per_ip burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Server-to-server Telegram code exchange is implemented by FastAPI.
    location = /api/v1/auth/telegram/oidc {
        limit_req zone=crm_auth_per_ip burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ^~ /api/ {
        limit_req zone=crm_api_per_ip burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location = /ws/deals {
        limit_conn crm_ws_per_ip 5;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $crm_connection_upgrade;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 30s;
    }

    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=crm_api_per_ip burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
